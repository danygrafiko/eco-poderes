<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eco-Poderes v6</title>
<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #0f172a;
    color: white;
  }
  button {
    padding: 10px 20px;
    margin: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  .card {
    border: 1px solid #334155;
    padding: 20px;
    margin: 10px;
    border-radius: 10px;
  }
</style>
</head>

<body>

<h1>🌱 Eco-Poderes v6</h1>

<div id="app"></div>

<script>

let state = {
  screen: "inicio",
  guardian: null,
  position: 0,
  energia: 0
};

function render() {
  const app = document.getElementById("app");

  if (state.screen === "inicio") {
    app.innerHTML = `
      <h2>Bienvenido</h2>
      <button onclick="start()">Jugar</button>
    `;
  }

  if (state.screen === "guardian") {
    app.innerHTML = `
      <h2>Elige tu Guardián</h2>

      <div class="card">
        🐺 Lobo – Velocidad
        <br>
        <button onclick="selectGuardian('Lobo')">Elegir</button>
      </div>

      <div class="card">
        🦅 Águila – Visión
        <br>
        <button onclick="selectGuardian('Aguila')">Elegir</button>
      </div>

      <div class="card">
        🐢 Tortuga – Resistencia
        <br>
        <button onclick="selectGuardian('Tortuga')">Elegir</button>
      </div>
    `;
  }

  if (state.screen === "game") {
    app.innerHTML = `
      <h2>Guardían: ${state.guardian}</h2>

      <p>Posición: ${state.position}</p>
      <p>Energía: ${state.energia}</p>

      <button onclick="rollDice()">🎲 Tirar Dado</button>

      <h3 id="evento"></h3>

      <hr>

      <h4>DEBUG</h4>
      <p>${JSON.stringify(state)}</p>
    `;
  }
}

function start() {
  state.screen = "guardian";
  render();
}

function selectGuardian(name) {
  state.guardian = name;
  state.screen = "game";
  render();
}

function rollDice() {
  let roll = Math.floor(Math.random() * 6) + 1;
  state.position += roll;

  let evento = generarEvento();
  document.getElementById("evento").innerText = evento;

  render();
}

function generarEvento() {
  let eventos = [
    "🌱 Plantaste un árbol (+2 energía)",
    "💧 Ahorraste agua (+1 energía)",
    "🔥 Contaminación (-1 energía)",
    "♻️ Reciclaste (+2 energía)"
  ];

  let e = eventos[Math.floor(Math.random() * eventos.length)];

  if (e.includes("+2")) state.energia += 2;
  if (e.includes("+1")) state.energia += 1;
  if (e.includes("-1")) state.energia -= 1;

  return e;
}

render();

</script>

</body>
</html>
